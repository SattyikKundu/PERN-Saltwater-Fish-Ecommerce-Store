name: Deploy PERN Frontend

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-frontend.yml"

  # Lets you manually run this workflow from the GitHub Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # Downloads the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Node.js 24 for the Vite build.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # Installs the exact frontend dependencies from package-lock.json.
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # Builds the production Vite application.
      # vars.* reads the two GitHub Repository Variables we just created.
      - name: Build frontend
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.VITE_STRIPE_PUBLIC_KEY }}
        run: npm run build

      # Uses GitHub OIDC to assume our PERN-specific AWS IAM role.
      # No permanent AWS access keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612120247054:role/GitHubActionsPERNDeployRole
          aws-region: us-east-1

      # Synchronizes the fresh Vite build with the private S3 frontend bucket.
      # --delete removes old hashed assets that are no longer in the new build.
      - name: Deploy frontend to S3
        run: aws s3 sync client/dist/ s3://pern-saltwater-fish-ecommerce-store-frontend --delete

      # Clears CloudFront's cached copy so visitors receive the new deployment.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1U0TOAIGU4E90 --paths "/*"